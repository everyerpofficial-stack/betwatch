services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betwatch}
      POSTGRES_DB: betwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betwatch"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://betwatch:${POSTGRES_PASSWORD:-betwatch}@db:5432/betwatch
      EMBEDDED_WORKER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://betwatch:${POSTGRES_PASSWORD:-betwatch}@db:5432/betwatch
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy  # api runs migrations + seed first
    restart: unless-stopped

volumes:
  pgdata:
