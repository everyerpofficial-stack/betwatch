<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Profile · BetWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
.prof-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));gap:20px;margin-top:20px}
.prof-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm)}
.prof-card h3{margin:0;font-size:16px;color:var(--text-main);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fact-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
.fact-row:last-child{border-bottom:0}
.fact-lbl{color:var(--text-muted);font-size:13px;flex:none;max-width:140px}
.fact-val{text-align:right;font-weight:500;color:var(--text-main)}
.fact-source{display:block;font-size:11px;color:var(--text-subtle);margin-top:2px;font-family:var(--font-mono)}
.link-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;background:var(--bg-subtle);color:var(--text-main);font:600 13px var(--font-sans);text-decoration:none;border:1px solid var(--border-subtle)}
.link-btn:hover{background:var(--border-subtle)}
.badge-unavail{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--bg-subtle);color:var(--text-muted);font-size:12px}
.chart-bar-container{display:flex;align-items:flex-end;gap:6px;height:70px;padding-top:10px;margin-top:8px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart-col-bar{width:100%;background:var(--accent-orange);border-radius:3px 3px 0 0;min-height:2px}
.chart-col-lbl{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono);transform:rotate(-45deg);margin-top:4px}
.table-post-row:hover td{background:var(--bg-subtle)}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <a href="/" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" stroke="#FDBA74" stroke-width="2"></rect><path d="M9 22l5-6 4 4 7-9" stroke="#FDBA74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div>
          <div class="brand-name">BetWatch</div>
          <div class="brand-sub">Channel Profile &amp; Acquisition Intelligence</div>
        </div>
      </a>
    </div>
    <div class="top-right">
      <button type="button" class="btn-theme" id="theme-toggle" title="Toggle Light / Dark theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <a class="btn-amber" href="/">Back to Dashboard</a>
      <a class="btn-amber" style="background:#374151;color:#F9FAFB" href="/admin">Admin</a>
    </div>
  </div>
</header>

<div id="content" class="wrap" style="padding-top:20px;padding-bottom:60px">
  <div class="ph" style="margin-top:20px">Loading channel profile…</div>
</div>

</div>

<script>
  function initTheme() {
    const saved = localStorage.getItem("bw-theme");
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = saved || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.onclick = () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("bw-theme", next);
      };
    }
  }
  initTheme();

(async function() {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "#");
  const toneCls = (t) => "tone " + esc(t);

  const pathParts = window.location.pathname.split("/").filter(Boolean);
  const outletId = pathParts[pathParts.length - 1];

  if (!outletId || isNaN(outletId)) {
    document.getElementById("content").innerHTML = `<div class="ph empty">Invalid channel ID. <a href="/">Return to dashboard</a></div>`;
    return;
  }

  let data = null;
  let page = 1;
  let searchQuery = "";

  async function loadData() {
    try {
      const p = new URLSearchParams({ page: String(page), limit: "50", q: searchQuery });
      const res = await fetch(`/api/channels/${outletId}?` + p);
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
      document.title = `${data.outlet.name} · Channel Profile · BetWatch`;
      render();
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="ph empty">Could not load channel profile: ${esc(err.message)}. <a href="/">Return to dashboard</a></div>`;
    }
  }

  function render() {
    const d = data;
    const o = d.outlet;
    const p = d.profile;
    const c = d.coverage;
    const aud = d.audience;
    const tr = d.track_record;

    // Link icons / labels
    const linkLabels = {
      website: "Official Website",
      youtube: "YouTube Channel",
      instagram: "Instagram",
      facebook: "Facebook Page",
      twitter: "X (Twitter)",
      linkedin: "LinkedIn",
      telegram: "Telegram Channel"
    };

    const linkButtonsHtml = d.links.map((l) =>
      `<a href="${safeUrl(l.url)}" target="_blank" rel="noopener noreferrer" class="link-btn">
         <span>${esc(linkLabels[l.platform] || l.platform)}</span> ↗
       </a>`
    ).join("");

    // Monthly chart
    const maxMonth = Math.max(1, ...c.posts_per_month.map((m) => m.count));
    const chartHtml = c.posts_per_month.length ? `
      <div class="chart-bar-container">
        ${c.posts_per_month.map((m) => {
          const h = Math.round((m.count / maxMonth) * 100);
          return `<div class="chart-col" title="${m.month}: ${m.count} posts">
            <div class="chart-col-bar" style="height:${h}%"></div>
            <span class="chart-col-lbl">${esc(m.month.slice(5))}</span>
          </div>`;
        }).join("")}
      </div>` : `<div class="muted small">No monthly data</div>`;

    // Audience list
    const audienceHtml = aud.map((a) => `
      <div class="fact-row">
        <div>
          <strong style="color:var(--text-main)">${esc(a.platform)}</strong>
          <span class="fact-source">${esc(a.source)}${a.as_of ? ` · as of ${esc(a.as_of)}` : ""}</span>
        </div>
        <div style="text-align:right">
          ${a.value ? `<span class="mono" style="font-weight:600;color:#047857">${esc(a.value)}</span>`
                    : `<span class="badge-unavail">Not available</span><span class="fact-source">${esc(a.reason || "")}</span>`}
        </div>
      </div>
    `).join("");

    // Posts table
    const postsRowsHtml = d.posts.map((post) => `
      <tr class="table-post-row">
        <td class="mono" style="white-space:nowrap;font-size:12px;color:var(--text-muted)">${esc(post.published_at_fmt)}</td>
        <td>
          <div style="font-weight:600;color:var(--text-main)">${esc(post.title)}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
            Story: ${post.story_id ? `<a href="/story/${post.story_id}" target="_blank" rel="noopener" style="color:#9A3412">${esc(post.story_title)}</a>` : "Standalone"}
          </div>
        </td>
        <td style="color:var(--text-muted)">${esc(post.journalist)}</td>
        <td><span class="${toneCls(post.tone)}">${esc(post.tone)}</span></td>
        <td style="text-align:right">
          <a href="${safeUrl(post.url)}" target="_blank" rel="noopener noreferrer" class="peek" style="min-height:30px;padding:0 8px;font-size:12px">Open ↗</a>
        </td>
      </tr>
    `).join("");

    document.getElementById("content").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:12px">
        <a href="/" class="back-link">← Back to Dashboard</a>
        <a href="/api/reports/channel/${o.id}.pdf" target="_blank" rel="noopener" class="btn-amber" style="min-height:38px;line-height:38px;font-size:13px">Download channel report (PDF) ↗</a>
      </div>

      <!-- SECTION A: Header -->
      <div style="margin:20px 0 10px">
        <div class="tags" style="margin-bottom:8px">
          <span class="tag">${esc(o.kind)}</span>
          <span class="tag">${esc(o.country || "Country unknown")}</span>
          <span class="tag">${c.total_posts} collected posts</span>
          ${d.wikidata.qid ? `<a href="${safeUrl(d.wikidata.url)}" target="_blank" rel="noopener" class="tag" style="color:#9A3412">Wikidata: ${esc(d.wikidata.qid)} ↗</a>` : `<span class="tag">Wikidata not linked</span>`}
        </div>
        <h1 style="font-size:28px;margin:0 0 10px;font-weight:700">${esc(o.name)}</h1>
        <div class="link-btns">${linkButtonsHtml || `<span class="muted small">No verified official pages found yet</span>`}</div>
      </div>

      <!-- SECTION B-E: 4 Profile Cards -->
      <div class="prof-grid">
        <!-- B: About this channel -->
        <div class="prof-card">
          <h3>About this channel</h3>
          <div class="fact-row">
            <span class="fact-lbl">Founded / Started</span>
            <div class="fact-val">
              <span>${esc(p.founded)}</span>
              <span class="fact-source">${esc(p.founded_source)}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Owner / Parent</span>
            <div class="fact-val">
              <span>${esc(p.owner)}</span>
              <span class="fact-source">${esc(p.owner_source)}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Headquarters</span>
            <div class="fact-val">
              <span>${esc(p.headquarters)}</span>
              <span class="fact-source">${esc(p.headquarters_source)}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Stock Exchange</span>
            <div class="fact-val">
              <span>${esc(p.stock_exchange)}${p.ticker && p.ticker !== "—" ? ` (${esc(p.ticker)})` : ""}</span>
              <span class="fact-source">${d.wikidata.qid ? `Wikidata (${esc(d.wikidata.qid)})` : "Not listed"}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Share price</span>
            <div class="fact-val">
              <span class="badge-unavail">Not available</span>
              <span class="fact-source">${esc(p.share_price_reason)}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Share capital</span>
            <div class="fact-val">
              <span>${esc(p.share_capital)}</span>
              <span class="fact-source">${esc(p.share_capital_source)}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Offices</span>
            <div class="fact-val">
              <span>${esc(p.offices)}</span>
              <span class="fact-source">${esc(p.offices_source)}</span>
            </div>
          </div>
        </div>

        <!-- C: Audience -->
        <div class="prof-card">
          <h3>Audience statistics</h3>
          <p class="muted small" style="margin:0 0 6px">Only live counts from official APIs are shown. Without the API key a platform shows “Not available” — no figures are estimated or typed in.</p>
          ${audienceHtml}
        </div>

        <!-- D: Track record -->
        <div class="prof-card">
          <h3>Track record &amp; Legal</h3>
          <div style="font-weight:600;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Fact checks mentioning this outlet</div>
          <div class="fact-row">
            <div>
              <span>${tr.fact_checks.total} fact-check mentions</span>
              <span class="fact-source">${esc(tr.fact_checks.source)}</span>
            </div>
            <div>
              ${tr.fact_checks.status === "Available" ? `<span class="mono" style="font-weight:600">${tr.fact_checks.total}</span>` : `<span class="badge-unavail">${esc(tr.fact_checks.status)}</span><span class="fact-source">${esc(tr.fact_checks.reason)}</span>`}
            </div>
          </div>

          <div style="font-weight:600;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:10px">Legal cases &amp; court record</div>
          ${tr.legal_cases.length ? tr.legal_cases.map((lc) => `
            <div class="fact-row">
              <div style="font-size:13px">
                <div>${esc(lc.fact)}</div>
                <span class="fact-source"><a href="${safeUrl(lc.source_url)}" target="_blank" rel="noopener">Source ↗</a> · as of ${esc(lc.as_of)}</span>
              </div>
            </div>
          `).join("") : `<div class="muted small">No legal cases entered yet. Enter in Admin with source URL and date.</div>`}

          <div style="font-weight:600;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:10px">Wins / Losses</div>
          ${tr.wins_losses.length ? tr.wins_losses.map((wl) => `
            <div class="fact-row">
              <div style="font-size:13px">
                <div>${esc(wl.fact)}</div>
                <span class="fact-source"><a href="${safeUrl(wl.source_url)}" target="_blank" rel="noopener">Source ↗</a> · as of ${esc(wl.as_of)}</span>
              </div>
            </div>
          `).join("") : `<div class="muted small">No wins/losses entered yet. Enter in Admin with source URL and date.</div>`}
        </div>

        <!-- E: Coverage -->
        <div class="prof-card">
          <h3>BetWatch Coverage Intelligence</h3>
          <div class="fact-row">
            <span class="fact-lbl">Total posts collected</span>
            <div class="fact-val mono" style="font-size:18px;color:#9A3412">${c.total_posts}</div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">First post collected</span>
            <div class="fact-val">
              <div style="font-size:13px;font-weight:500">${c.first_post ? esc(c.first_post.title) : "—"}</div>
              <span class="fact-source">${c.first_post ? esc(c.first_post.date) : ""}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Latest post</span>
            <div class="fact-val">
              <div style="font-size:13px;font-weight:500">${c.latest_post ? esc(c.latest_post.title) : "—"}</div>
              <span class="fact-source">${c.latest_post ? esc(c.latest_post.date) : ""}</span>
            </div>
          </div>
          <div class="fact-row">
            <span class="fact-lbl">Tone split</span>
            <div class="fact-val">
              <span class="tone Negative" style="padding:2px 6px">Neg ${c.tone_split.Negative}</span>
              <span class="tone Neutral" style="padding:2px 6px">Neu ${c.tone_split.Neutral}</span>
              <span class="tone Positive" style="padding:2px 6px">Pos ${c.tone_split.Positive}</span>
            </div>
          </div>
          <div style="margin-top:6px">
            <span class="fact-lbl" style="margin-bottom:6px;display:block">Posts per month (timeline)</span>
            ${chartHtml}
          </div>
        </div>
      </div>

      <!-- SECTION F: All collected posts -->
      <div class="posts-card" style="margin-top:24px">
        <div class="posts-card-header">
          <div>
            <h3 style="margin:0 0 4px;font-size:16px">All collected posts from ${esc(o.name)}</h3>
            <span class="muted small">Showing ${d.posts.length} of ${d.pagination.total} total posts</span>
          </div>
          <div>
            <input type="search" id="chan-post-search" placeholder="Search headlines…" value="${esc(searchQuery)}" style="padding:6px 12px;border:1px solid #D1D5DB;border-radius:8px;font-size:13px;min-width:220px">
          </div>
        </div>

        <div style="overflow-x:auto">
          <table class="posts-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Headline &amp; Story</th>
                <th>Journalist</th>
                <th>Tone</th>
                <th style="text-align:right">Link</th>
              </tr>
            </thead>
            <tbody>
              ${postsRowsHtml || `<tr><td colspan="5" class="empty muted">No posts found matching search.</td></tr>`}
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        ${d.pagination.pages > 1 ? `
          <div style="display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;border-top:1px solid #E5E7EB">
            <button type="button" class="peek" id="prev-page"${page <= 1 ? " disabled style='opacity:.5'" : ""}>← Previous</button>
            <span class="mono muted small">Page ${d.pagination.page} of ${d.pagination.pages}</span>
            <button type="button" class="peek" id="next-page"${page >= d.pagination.pages ? " disabled style='opacity:.5'" : ""}>Next →</button>
          </div>
        ` : ""}
      </div>
    `;

    // Bind search and pagination
    const searchInput = document.getElementById("chan-post-search");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim();
        page = 1;
        loadData();
      });
    }

    const prevBtn = document.getElementById("prev-page");
    if (prevBtn) {
      prevBtn.addEventListener("click", () => {
        if (page > 1) {
          page--;
          loadData();
        }
      });
    }

    const nextBtn = document.getElementById("next-page");
    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        page++;
        loadData();
      });
    }
  }

  loadData();
})();
</script>
</body>
</html>
