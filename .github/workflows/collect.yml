name: Collect news

# Vercel keeps no files and cannot run a collector, so this job collects on a schedule and publishes the SQLite database
# as an asset of the "data" release. Deployments download it from there (backend/app/snapshot.py), so fresh data needs
# neither a commit nor a redeploy. Keep the schedule well under STALE_AFTER_MINUTES in services/dashboard.py.
# GitHub fires this schedule only every few hours, so deployments with GITHUB_DISPATCH_TOKEN also start it (workflow_dispatch)
# when someone visits and the data is over 30 minutes old (request_collection() in backend/app/snapshot.py).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write # publish the release asset
  actions: write # keep the schedule enabled

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      # The release holds the only full copy. If it exists but cannot be read, this step fails rather than continuing
      # from the older bundled database, which would publish over everything collected since.
      - name: Start from the last published database
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern betwatch.db --dir backend --clobber \
              || gh release download data --pattern betwatch-backup.db --output backend/betwatch.db --clobber
          else
            gh release create data --prerelease --title "Collected data" \
              --notes "Database published by the Collect news workflow. Replaced on every run."
          fi

      # API keys are optional: without them those sources stay off and new stories get publisher excerpts.
      - name: Collect
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./betwatch.db
          USER_AGENT: BetWatchBot/1.0 (+https://github.com/everyerpofficial-stack/betwatch)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python -m app.seed
          python -m app.worker --once
          python -m app.snapshot "$RUNNER_TEMP/betwatch.db"

      # Replacing an asset deletes it first, so the backup goes up second: a failed upload never loses both.
      - name: Publish
        run: |
          cp "$RUNNER_TEMP/betwatch.db" "$RUNNER_TEMP/betwatch-backup.db"
          gh release upload data "$RUNNER_TEMP/betwatch.db" --clobber
          gh release upload data "$RUNNER_TEMP/betwatch-backup.db" --clobber

      # GitHub can pause schedules in a repository with no commits for 60 days.
      - name: Keep the schedule enabled
        continue-on-error: true
        run: gh workflow enable collect.yml
